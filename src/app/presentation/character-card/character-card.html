@let person = character();
<article class="card">
  <div class="portrait">
    <img [src]="person.image" alt="" width="300" height="300" loading="lazy" decoding="async">
    <span class="status" [attr.data-status]="person.status">{{ statusLabels[person.status] }}</span>
  </div>
  <div class="card-body">
    <h3><button type="button" class="details-button" (click)="selected.emit(person)">{{ person.name }}</button></h3>
    <p>{{ speciesLabel(person.species) }}</p>
  </div>
  <button
    type="button"
    class="favorite-button"
    [attr.aria-pressed]="favorite()"
    [attr.aria-label]="person.name + ' en favoritos'"
    (click)="favoriteToggled.emit(person)"
  ><span aria-hidden="true">{{ favorite() ? '♥' : '♡' }}</span></button>
</article>
